name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - run: go build ./...
      - run: go vet ./...
      # golangci-lint's configured linters do not include gofmt, so formatting
      # drift reached HEAD unnoticed. `gofmt -l` prints one path per dirty
      # file; the list is the failure message.
      - name: Check formatting
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 -r gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "gofmt reported unformatted files:" >&2
            echo "$unformatted" >&2
            echo "Run 'gofmt -w .' and commit the result." >&2
            exit 1
          fi
      # Same process bounds as the release gate's race leg: fixed -p/-parallel
      # so a runner-spec change cannot shift scheduling-sensitive tests.
      - run: timeout 900s go test -race -timeout 10m -p 2 -parallel 2 -count=1 ./...

  # go.mod declares go 1.24.0. The test job above and the release gate both
  # select 1.27, so nothing else here exercises the declared floor: a change
  # that compiles on 1.27 but not on 1.24 would reach a release unnoticed.
  # This job runs the same build/vet/test set on 1.24.0, without -race, which
  # is the axis the floor is about.
  # One exception: internal/goldset's TestGoldsetVMAllocations asserts exact
  # equality against allocation counts captured through testing.AllocsPerRun,
  # and those pins are measured under the CI toolchain. They are not portable
  # to the declared floor, and the 1.24 runtime reports different counts, so
  # this lane skips that test and covers compilation, vet, and the
  # version-stable tests. The pins stay enforced by the 1.27 test job above
  # and by the release consumer gate.
  go-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: timeout 900s go test -timeout 10m -p 2 -parallel 2 -count=1 -skip '^TestGoldsetVMAllocations$' ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      # v2.13's type-checker decodes export data at most version 4, while the
      # runner's go 1.27.x toolchain now emits version 5, so typecheck fails on
      # files the release never touched. v2.14.0 is built with go 1.27 and is
      # the version verified locally; the pin must move with the go-version.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
