# Release consumer gate (openspec/changes/release-consumer-gate, ADR 0008).
#
# ci.yml triggers on push to main/master and pull_request; this workflow
# triggers on workflow_dispatch and on a stable release going public. The two
# trigger sets are disjoint, so they never run on the same event -- ordinary
# PR CI carries no percentage gates by construction (tasks.md 4.1).
#
# The gate is self-contained: it runs the committed gold set
# (internal/goldset) under both execution modes -- no consumer checkout, no
# cross-repo secret. The corpus is owned by this repo, modeled on embedder
# rule workloads, with hand-derived goldens and committed tier assignments
# (internal/perfgate/tiers.json).
name: Release consumer gate

on:
  workflow_dispatch: {}
  # A release trigger only fires after the release is already public --
  # Actions has no pre-publish hook -- so this can never block a release.
  # What it does: record post-hoc regression evidence against the published
  # release and store that run's bench-vm.txt as the next release's
  # non-regression baseline.
  #
  # It stayed commented out while the gate had never been exercised
  # end-to-end. That caution outlived its purpose: a gate nobody fires
  # produces no evidence at all, so every verdict recorded as "deferred to
  # the release runner" deferred to nothing. The fixed GOMAXPROCS and
  # BENCHTIME below make an automatic run reproducible enough to arm.
  #
  # `released`, not `published`: `published` also fires for pre-releases, and
  # the very first armed run is one-shot -- it runs in first-authorization
  # mode and its bench-vm.txt becomes the baseline every later release is
  # measured against. A pre-release would silently consume that slot and
  # pin the baseline to an rc. `released` covers a stable release going
  # public and a pre-release being promoted to one, which is exactly when a
  # baseline should be captured.
  #
  # A workflow_dispatch run resolves its gate mode from the same stored
  # baselines a release run reads, so gh auth and the baseline lookup are
  # rehearsable by dispatch and both triggers reach the same per-cell
  # verdicts on the same tree. It carries no release identity, so only the
  # asset upload is skipped -- tag_name interpolation and the upload itself
  # run for real the first time or not at all.
  release:
    types: [released]

# contents: write lets the passing gate store its bench-vm.txt as an asset on
# the release it authorized, and read the previous release's asset back as the
# next release's non-regression baseline (design.md "Decision rules").
permissions:
  contents: write

env:
  # 2 behaves identically on a 2- or 4-vCPU hosted runner, so a runner-spec
  # change can't silently shift a stored baseline; still gives real
  # parallelism for the concurrent tier.
  GOMAXPROCS: "2"
  # ~10^5 iterations per sample on these microsecond-scale fixtures, well
  # below the gate's +-5% non-regression tolerance -- ~48s of bench time per
  # mode-pass, affordable even when an inconclusive verdict doubles it.
  # Changing this (or GOMAXPROCS) invalidates every stored bench-vm.txt
  # baseline for non-regression comparison. Editing a .lisp fixture under
  # internal/goldset/testdata/ invalidates the same way, but only for that
  # fixture's two cells (Goldset/<name>, GoldsetParse/<name>): they would
  # otherwise be compared against a figure that measured different source.
  # An invalidated cell runs in first-authorization mode, or the release
  # records the comparison as measuring changed source.
  BENCHTIME: "200ms"
  # ADR 0008 "at least ten samples" floor -- real value, not a placeholder
  BENCH_COUNT: "10"

jobs:
  consumer-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      # Built once and run as a binary: `go run` collapses the program's exit
      # code to 1, which would make the needs-rerun signal (exit 2)
      # indistinguishable from a failure, and would hide resolve-mode's exit 3
      # the same way. Built before the mode is determined because that step is
      # its first caller.
      - name: Build the gate binary
        run: go build -o bin/perfgate ./cmd/perfgate

      # 3.3: first authorization uses ADR 0008's improvement thresholds; every
      # later release compares this candidate VM against the previous release's
      # stored bench-vm.txt as non-regression (design.md "Decision rules"). The
      # baseline is whichever earlier release still carries the asset; none
      # found means this is the first authorization. The mode comes from the
      # stored baselines, not from the triggering event, so a dispatched run
      # reaches the same verdicts a release run does on the same tree.
      #
      # Absence is decided from each release's asset list, never from a
      # download exit code: an unreadable repository state and an empty one
      # would otherwise be the same observation, and only the empty one may
      # select the first-authorization thresholds. The lookup records what was
      # observed; `perfgate resolve-mode` classifies it and fails the step when
      # it cannot be classified.
      - name: Determine gate mode
        id: gate-mode
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          enumeration_ok=true
          download_failed=false
          baseline_tag=""
          inspected=()

          if ! tags=$(gh release list --limit 30 --json tagName --jq '.[].tagName'); then
            enumeration_ok=false
            tags=""
          fi

          for tag in $tags; do
            # RELEASE_TAG is empty on a dispatch: there is no release being cut,
            # so nothing is excluded and the newest release is considered first.
            [ "$tag" = "$RELEASE_TAG" ] && continue
            if ! has_baseline=$(gh release view "$tag" --json assets --jq 'any(.assets[]; .name == "bench-vm.txt")'); then
              enumeration_ok=false
              break
            fi
            inspected+=("$tag")
            [ "$has_baseline" = "true" ] || continue
            if gh release download "$tag" --pattern bench-vm.txt --output baseline-vm.txt; then
              baseline_tag="$tag"
            else
              download_failed=true
            fi
            break
          done

          jq -n \
            --argjson enumeration_ok "$enumeration_ok" \
            --argjson download_failed "$download_failed" \
            --arg downloaded_tag "$baseline_tag" \
            '{EnumerationOK: $enumeration_ok, Tags: $ARGS.positional, DownloadedTag: $downloaded_tag, DownloadFailed: $download_failed}' \
            --args "${inspected[@]}" > baseline-lookup.json

          # resolve-mode prints the `mode=<name>` line the downstream steps
          # read, and exits non-zero without it when the lookup resolves to no
          # mode -- which fails this step under the runner's `bash -e`.
          bin/perfgate resolve-mode -lookup baseline-lookup.json >> "$GITHUB_OUTPUT"
          if [ -n "$baseline_tag" ]; then
            echo "baseline_tag=$baseline_tag" >> "$GITHUB_OUTPUT"
          fi

      # 2.1: correctness leg, untimed -- every gold-set fixture under both
      # execution modes against its golden; any failure fails the release.
      - name: Gold set under both execution modes
        run: go test ./internal/goldset/ -count=1

      # 2.1: untimed, never combined with -bench (ADR 0008: race runs are
      # separate and untimed).
      - name: Race suite
        run: go test -race -count=1 ./...

      # 3.1: paired release run -- Evaluator and VM samples interleaved per
      # iteration in one hosted job, fixed GOMAXPROCS and benchtime,
      # BENCH_COUNT samples per cell per mode. Cell names are identical
      # across the two output files so benchstat pairs them. Never combined
      # with -race.
      - name: Paired Evaluator/VM benchmark run
        env:
          GOMAXPROCS: ${{ env.GOMAXPROCS }}
        run: |
          for _ in $(seq "${{ env.BENCH_COUNT }}"); do
            GOLDSET_MODE="eval" go test ./internal/goldset/ -run '^$' -bench . -benchtime="${{ env.BENCHTIME }}" -count=1 -benchmem >> bench-evaluator.txt
            GOLDSET_MODE="vm" go test ./internal/goldset/ -run '^$' -bench . -benchtime="${{ env.BENCHTIME }}" -count=1 -benchmem >> bench-vm.txt
          done

      # 3.2/3.3: benchstat comparison against committed Hot-cell tiers (ADR
      # 0008 "Thresholds"), via internal/perfgate. First authorization pairs
      # this release's Evaluator vs VM against the improvement thresholds;
      # later releases pair the previous release's stored bench-vm.txt (the
      # baseline downloaded above) against this candidate as non-regression.
      # The mode is whatever the baseline lookup resolved -- there is no
      # default here, because a step that could not resolve one has already
      # failed the job. The `|| code=$?` capture keeps the runner's `bash -e`
      # from aborting before the output line is written.
      - name: Evaluate performance gate
        id: perfgate
        run: |
          mode="${{ steps.gate-mode.outputs.mode }}"
          old="bench-evaluator.txt"
          [ "$mode" = "non-regression" ] && old="baseline-vm.txt"
          code=0
          bin/perfgate \
            -old "$old" \
            -candidate bench-vm.txt \
            -tiers internal/perfgate/tiers.json \
            -mode "$mode" \
            -out verdict.txt || code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      # design.md "Decision rules" / ADR 0008 burden-of-proof rule: a still-
      # inconclusive cell (perfgate exit 2) gets exactly one rerun at doubled
      # benchtime, then Resolve() decides it -- improvement claims fail
      # unproven, non-regression claims pass unrefuted. Only runs when the
      # first attempt actually produced an inconclusive cell.
      - name: Rerun paired benchmark at doubled benchtime
        if: steps.perfgate.outputs.exit_code == '2'
        env:
          GOMAXPROCS: ${{ env.GOMAXPROCS }}
        run: |
          doubled=$(awk -v bt="${{ env.BENCHTIME }}" 'BEGIN{match(bt,/^[0-9.]+/);n=substr(bt,RSTART,RLENGTH);s=substr(bt,RSTART+RLENGTH);printf "%s%s", n*2, s}')
          rm -f bench-evaluator.txt bench-vm.txt
          for _ in $(seq "${{ env.BENCH_COUNT }}"); do
            GOLDSET_MODE="eval" go test ./internal/goldset/ -run '^$' -bench . -benchtime="$doubled" -count=1 -benchmem >> bench-evaluator.txt
            GOLDSET_MODE="vm" go test ./internal/goldset/ -run '^$' -bench . -benchtime="$doubled" -count=1 -benchmem >> bench-vm.txt
          done

      - name: Resolve inconclusive cells after rerun
        id: perfgate-rerun
        if: steps.perfgate.outputs.exit_code == '2'
        run: |
          mode="${{ steps.perfgate.outputs.mode }}"
          old="bench-evaluator.txt"
          [ "$mode" = "non-regression" ] && old="baseline-vm.txt"
          code=0
          bin/perfgate \
            -old "$old" \
            -candidate bench-vm.txt \
            -tiers internal/perfgate/tiers.json \
            -mode "$mode" \
            -rerun \
            -out verdict.txt || code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Enforce performance gate verdict
        run: |
          if [ "${{ steps.perfgate.outputs.exit_code }}" = "2" ]; then
            test "${{ steps.perfgate-rerun.outputs.exit_code }}" = "0"
          else
            test "${{ steps.perfgate.outputs.exit_code }}" = "0"
          fi

      # 3.3: the passing gate stores its bench-vm.txt as an asset on the
      # release it authorized, so the next release can gate against it as the
      # non-regression baseline. Reached only after the verdict step passed
      # (an implicit success() guards every if: without always()); release-
      # triggered only.
      #
      # Mode resolution above no longer keys on the triggering event, so this
      # event guard is the only thing keeping a dispatched run out of the
      # baseline slot -- the release-upload command below is the file's sole
      # writer of a release asset. Keep the guard on the event, never on the
      # resolved mode: a dispatch that resolves first-authorization would
      # otherwise publish a baseline.
      - name: Store VM baseline on the authorized release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" bench-vm.txt --clobber

      # 3.4: publish the paired benchmark output and verdict as release
      # evidence, even when the job fails. baseline-vm.txt is present only on
      # post-authorization releases.
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-gate-evidence
          path: |
            bench-evaluator.txt
            bench-vm.txt
            baseline-vm.txt
            verdict.txt
          if-no-files-found: warn
